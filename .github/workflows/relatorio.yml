name: Relatório semanal de resultados

on:
  schedule:
    - cron: "11 20 * * 0"   # domingo 17:11 (Brasília), antes da tarefa das 17:43
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar relatório
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.FB_PAGE_ID }}
          MARCA: "Advocacia Soares"
        run: python relatorio.py
      - name: Salvar
        run: |
          git config user.name "Relatório Advocacia Soares"
          git config user.email "actions@users.noreply.github.com"
          git add relatorios
          if ! git diff --cached --quiet; then
            git commit -m "relatório semanal"
            git pull --rebase
            git push
          fi
